<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="zapGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#zapGradient)" />

  <!-- Phone Outline -->
  <rect x="18" y="10" width="28" height="44" rx="6" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.9" />

  <!-- Phone Speaker / Top notch -->
  <line x1="28" y1="14" x2="36" y2="14" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Zap / Lightning Bolt inside phone -->
  <path d="M34 18L24 33H33L30 46L41 30H32L34 18Z" fill="#FBBF24" stroke="#D97706" stroke-width="0.5" filter="url(#glow)" />
</svg>
